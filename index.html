<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Where2Eat</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍽️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4EC; --surface:#FFFFFF; --ink:#1E2A21; --muted:#66756A; --line:#D7DED2;
  --accent:#9B2747; --accent-ink:#FFFFFF; --accent-soft:#F4DDE4; --gold:#D9921F; --star-off:#D3D9CF;
  --display:"Karantina","Arial Narrow",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131915; --surface:#1C241E; --ink:#E7ECE4; --muted:#9AA79D; --line:#2E3A31;
    --accent:#E46A8C; --accent-ink:#1A0D12; --accent-soft:#3A1F29; --gold:#F0B550; --star-off:#3A463C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131915; --surface:#1C241E; --ink:#E7ECE4; --muted:#9AA79D; --line:#2E3A31;
  --accent:#E46A8C; --accent-ink:#1A0D12; --accent-soft:#3A1F29; --gold:#F0B550; --star-off:#3A463C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-inner{max-width:760px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-size:2.1rem;line-height:1;font-weight:700;text-decoration:none;letter-spacing:.01em}
nav.tabs{display:flex;gap:4px;margin-inline-start:auto}
nav.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;font-weight:600;font-size:.95rem;color:var(--muted)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.who{font-size:.9rem;font-weight:600;text-decoration:none;padding:6px 10px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.who.cta{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

main{max-width:760px;margin:0 auto;padding:22px 18px 80px}
h1{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:.95;margin:0 0 6px}
h2{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1;margin:28px 0 10px}
.lede{color:var(--muted);margin:0 0 20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.small{padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.9rem}

.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:600;font-size:.92rem}
input[type=text],input[type=search],input[type=password],select{width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface)}
input:focus,select:focus{border-color:var(--accent);outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.note{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:.95rem}
.err{color:var(--accent);font-weight:600;font-size:.92rem;min-height:1.2em;margin:0 0 8px}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.toolbar input{flex:2 1 200px}.toolbar select{flex:1 1 140px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:.92rem;cursor:pointer;font-weight:600}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flabel{font-weight:600;font-size:.92rem}
#rcNew{margin-top:8px}

.cat-head{display:flex;align-items:baseline;gap:8px;margin:26px 0 6px}
.cat-head h2{margin:0}
.cat-head span{color:var(--muted);font-size:.9rem}
ul.rlist{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.rlist li a{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.rname{font-weight:700;font-size:1.1rem}
.rmeta{color:var(--muted);font-size:.9rem}
.rscore{grid-row:1 / span 2;align-self:center;text-align:left;font-variant-numeric:tabular-nums}
.rscore b{font-size:1.4rem;display:block;line-height:1}

.stars{position:relative;display:inline-block;font-size:1rem;line-height:1;letter-spacing:1px;color:var(--star-off);white-space:nowrap;direction:ltr}
.stars::before{content:"★★★★★"}
.stars i{position:absolute;inset:0 auto 0 0;overflow:hidden;color:var(--gold);font-style:normal}
.stars i::before{content:"★★★★★"}

.rest-head .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 18px}
.tag{background:var(--accent-soft);border-radius:999px;padding:2px 10px;font-weight:600;font-size:.9rem}
.dish{border-top:1px solid var(--line);padding:16px 0}
.dish-top{display:flex;align-items:flex-start;gap:12px}
.dish-name{font-weight:700;font-size:1.15rem;flex:1}
.score{text-align:center;min-width:72px}
.score b{font-family:var(--display);font-size:2.6rem;line-height:.9;display:block;font-variant-numeric:tabular-nums}
.score small{color:var(--muted);font-size:.8rem;display:block;margin-top:2px}
.score.none b{color:var(--muted)}
.rate{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.rate-label{font-size:.9rem;color:var(--muted)}
.star-input{display:inline-flex;direction:ltr}
.star-input button{background:none;border:0;padding:2px 3px;font-size:1.7rem;line-height:1;cursor:pointer;color:var(--star-off)}
.star-input button.on{color:var(--gold)}
details.raters{margin-top:8px}
details.raters summary{cursor:pointer;color:var(--muted);font-size:.9rem}
details.raters ul{list-style:none;padding:0;margin:8px 0 0}
details.raters li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rnote{color:var(--muted);font-size:.9rem;margin-top:2px;overflow-wrap:anywhere}
.note-form{display:flex;gap:8px;margin-top:8px}
.note-form input{flex:1;padding:8px 10px}

/* The draw */
.reel-wrap{position:relative;margin:22px 0;border-radius:22px;background:var(--ink);color:var(--bg);padding:28px 18px 26px;text-align:center;overflow:hidden}
.reel-wrap::before,.reel-wrap::after{content:"";position:absolute;inset-inline:0;height:10px;background:repeating-linear-gradient(90deg,var(--accent) 0 14px,transparent 14px 28px);opacity:.9}
.reel-wrap::before{top:0}.reel-wrap::after{bottom:0}
.reel{font-family:var(--display);font-weight:700;font-size:clamp(3rem,13vw,5.6rem);line-height:1;min-height:1.1em;overflow-wrap:anywhere}
.reel.spinning{opacity:.75;filter:blur(.6px)}
.reel-sub{margin-top:10px;min-height:1.5em;opacity:.8}
.reel-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.reel-wrap .btn.ghost{color:var(--bg);border-color:rgba(255,255,255,.35)}
@keyframes land{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.reel.landed{animation:land .45s ease-out}
.big-draw{font-size:1.25rem;padding:16px 28px;border-radius:16px;width:100%}
.pool{color:var(--muted);font-size:.92rem;margin-top:8px;text-align:center}

.scope{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 18px;padding:8px 12px;background:var(--accent-soft);border-radius:12px}
.scope label{font-weight:600;font-size:.92rem}
.scope select{width:auto;flex:1 1 180px;padding:7px 10px}
ul.glist{list-style:none;margin:0 0 18px;padding:0;border-top:1px solid var(--line)}
ul.glist li{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 2px;border-bottom:1px solid var(--line)}
.gcode{display:flex;align-items:center;gap:10px}
.gcode code{font-size:1.1rem;font-weight:700;letter-spacing:.15em;direction:ltr;font-family:var(--body)}
.codein{text-transform:uppercase;letter-spacing:.15em}
.combo{position:relative}
.combo ul{position:absolute;inset-inline:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;z-index:6;max-height:260px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.combo li{padding:9px 10px;border-radius:8px;cursor:pointer}
.combo li[aria-selected="true"],.combo li:hover{background:var(--accent-soft)}
.combo li mark{background:none;color:var(--accent);font-weight:700}
.empty{padding:28px 0;color:var(--muted)}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:480px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;z-index:20;transform:translateY(150%);transition:transform .25s}
.toast.show{transform:none}
@media (prefers-reduced-motion:reduce){.reel.landed{animation:none}.toast{transition:none}}
@media (max-width:520px){h1{font-size:2.8rem}.brand{font-size:1.8rem}nav.tabs a{padding:6px 9px}}

.auth{max-width:420px;margin:12px auto 0}
.gbtn{width:100%;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);padding:13px 18px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);margin:18px 0;font-size:.9rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.hint{color:var(--muted);font-size:.88rem;margin:-4px 0 12px}
.switch{text-align:center;margin-top:16px}
.setup{max-width:560px}
.setup code{background:var(--accent-soft);padding:1px 6px;border-radius:6px;direction:ltr;display:inline-block}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <a class="brand" href="#/" dir="ltr">Where2Eat</a>
  <nav class="tabs" aria-label="ניווט" id="tabs" hidden>
    <a href="#/" data-tab="home">מסעדות</a>
    <a href="#/draw" data-tab="draw">הגרלה</a>
  </nav>
  <a class="who" id="who" href="#/settings" hidden></a>
</div></header>
<main id="app"><p class="empty">טוען…</p></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
